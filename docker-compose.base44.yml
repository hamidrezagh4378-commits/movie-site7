# Base44 development environment — Lumière Beauty (Vite + React SPA)
# Runs the app from the cloned source with live reload. No prebuilt images.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ${BASE44_PROJECT_ROOT:-.}:/app
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
      - CI=true
      - CHOKIDAR_USEPOLLING=1
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
